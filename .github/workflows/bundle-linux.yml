name: NAQYA Linux-Bundle-Nachweis

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: '946684800'
  TAURI_CLI_VERSION: '2.11.4'

jobs:
  linux-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnosevertrag vor Build sperren
        run: python3 tests/validate_platform_diagnostics.py

      - name: Linux-Buildabhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev cmake build-essential \
            patchelf dpkg-dev

      - name: Diagnosevertrag und Laufzeitregression prüfen
        run: |
          node tests/diagnostics_runtime.test.js
          python3 tests/validate_diagnostics.py

      - name: Desktop-Frontend deterministisch stagen
        run: |
          python3 tools/stage_desktop_frontend.py
          python3 tests/validate_dist.py

      - name: Statischen whisper.cpp-Sidecar bauen
        run: |
          bash tools/build_whisper_sidecar.sh
          (cd src-tauri/binaries && sha256sum -c naqya-whisper-x86_64-unknown-linux-gnu.sha256)
          src-tauri/binaries/naqya-whisper-x86_64-unknown-linux-gnu --help >/dev/null

      - name: Tauri-CLI reproduzierbar installieren
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Linux-DEB bauen
        run: cargo tauri build --bundles deb

      - name: DEB-Metadaten deterministisch normalisieren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t packages < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print)
          [[ ${#packages[@]} -eq 1 ]] || { echo "FEHLER: Erwartet genau ein Tauri-DEB, gefunden: ${#packages[@]}" >&2; exit 19; }
          bash tools/repack_deb_deterministic.sh "${packages[0]}" release/NAQYA-0.5.0-linux-x86_64.deb

      - name: Paketinhalt und Sidecar im Paketkontext prüfen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bundle-extract
          mkdir -p .bundle-extract
          dpkg-deb -x release/NAQYA-0.5.0-linux-x86_64.deb .bundle-extract
          mapfile -t sidecars < <(find .bundle-extract -type f -name 'naqya-whisper*' -print)
          [[ ${#sidecars[@]} -eq 1 ]] || { echo "FEHLER: Erwartet genau einen gepackten Sidecar, gefunden: ${#sidecars[@]}" >&2; exit 21; }
          cp "${sidecars[0]}" release/naqya-whisper-packaged
          chmod +x release/naqya-whisper-packaged
          release/naqya-whisper-packaged --help >/dev/null

          if ldd release/naqya-whisper-packaged > release/runtime-deps.txt 2>&1; then
            ! grep -q 'not found' release/runtime-deps.txt || { cat release/runtime-deps.txt; exit 22; }
          else
            grep -Eq 'not a dynamic executable|statically linked' release/runtime-deps.txt || { cat release/runtime-deps.txt; exit 23; }
          fi

          source_hash="$(sha256sum src-tauri/binaries/naqya-whisper-x86_64-unknown-linux-gnu | awk '{print $1}')"
          packaged_hash="$(sha256sum release/naqya-whisper-packaged | awk '{print $1}')"
          [[ "$source_hash" == "$packaged_hash" ]] || { echo "FEHLER: Gepackter Sidecar wurde verändert." >&2; exit 24; }

      - name: Installiertes Linux-Paket und GUI-Start in sauberer Runtime prüfen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci-smoke
          mkdir -p ci-smoke
          docker run --rm \
            -v "$PWD/release:/release:ro" \
            -v "$PWD/ci-smoke:/ci-smoke" \
            ubuntu:24.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              echo "START: saubere Ubuntu-24.04-Runtime" > /ci-smoke/result.txt
              apt-get update
              apt-get install -y --no-install-recommends \
                /release/NAQYA-0.5.0-linux-x86_64.deb \
                xvfb xauth dbus-x11 passwd ca-certificates

              dpkg-query -W -f="\${Status}\n" libwebkit2gtk-4.1-0 | grep -qx "install ok installed"
              dpkg-query -W -f="\${Status}\n" libjavascriptcoregtk-4.1-0 | grep -qx "install ok installed"
              if dpkg-query -W -f="\${Status}\n" libgtk-3-0t64 2>/dev/null | grep -qx "install ok installed"; then
                gtk_runtime_package=libgtk-3-0t64
              elif dpkg-query -W -f="\${Status}\n" libgtk-3-0 2>/dev/null | grep -qx "install ok installed"; then
                gtk_runtime_package=libgtk-3-0
              else
                echo "FEHLER: Keine installierte GTK-3-Runtime gefunden." | tee /ci-smoke/result.txt >&2
                exit 27
              fi
              echo "GTK_RUNTIME=$gtk_runtime_package" >> /ci-smoke/result.txt

              ldd /usr/bin/naqya-memo | tee /ci-smoke/naqya-gui-runtime-deps.txt
              if grep -q "not found" /ci-smoke/naqya-gui-runtime-deps.txt; then
                echo "FEHLER: Der installierten NAQYA-GUI fehlen dynamische Bibliotheken." | tee /ci-smoke/result.txt >&2
                exit 25
              fi

              useradd --create-home --shell /bin/bash naqya-test
              install -d -m 700 -o naqya-test -g naqya-test /tmp/naqya-runtime
              set +e
              timeout --signal=TERM 8s runuser -u naqya-test -- \
                env HOME=/home/naqya-test \
                    XDG_RUNTIME_DIR=/tmp/naqya-runtime \
                    GDK_BACKEND=x11 \
                    WEBKIT_DISABLE_DMABUF_RENDERER=1 \
                    WEBKIT_DISABLE_COMPOSITING_MODE=1 \
                    LIBGL_ALWAYS_SOFTWARE=1 \
                    NO_AT_BRIDGE=1 \
                dbus-run-session -- xvfb-run -a /usr/bin/naqya-memo \
                > /ci-smoke/naqya-gui-start.log 2>&1
              rc=$?
              set -e

              if [[ "$rc" -eq 124 ]]; then
                echo "PASS: Installierte NAQYA-GUI blieb bis zum 8-Sekunden-Smoke-Timeout aktiv." | tee /ci-smoke/result.txt
                exit 0
              fi

              {
                echo "FEHLER: Installierte NAQYA-GUI beendete sich vor dem Smoke-Timeout (Exit $rc)."
                echo "--- GUI-LOG ---"
                cat /ci-smoke/naqya-gui-start.log || true
                echo "--- PAKETE ---"
                dpkg-query -W libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 libgtk-3-0t64 libgtk-3-0 || true
                echo "--- RUNTIME ---"
                ls -ld /home/naqya-test /tmp/naqya-runtime || true
              } | tee /ci-smoke/result.txt >&2
              exit 26
            '

      - name: GUI-Smoke-Diagnose sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naqya-linux-gui-smoke-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: ci-smoke/

      - name: Release-Nachweis erzeugen
        env:
          NAQYA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/generate_release_evidence.py \
            --target-os linux \
            --package release/NAQYA-0.5.0-linux-x86_64.deb \
            --sidecar release/naqya-whisper-packaged \
            --source-sidecar src-tauri/binaries/naqya-whisper-x86_64-unknown-linux-gnu \
            --runtime-deps release/runtime-deps.txt \
            --package-format deb \
            --reproducibility-profile dpkg-deb-normalized-v1 \
            --sidecar-started \
            --dependencies-resolved \
            --package-reproducibility-verified
          python3 tests/validate_release_evidence.py release/RELEASE_EVIDENCE.json

      - name: Nachweisartefakte sichern
        uses: actions/upload-artifact@v4
        with:
          name: naqya-linux-bundle-nachweis-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/NAQYA-0.5.0-linux-x86_64.deb
            release/RELEASE_EVIDENCE.json
            release/RELEASE_EVIDENCE.txt
            release/runtime-deps.txt
