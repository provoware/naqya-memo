name: PRE-AUTOSAVE v0.3.16 Cross-Platform Acceptance

on:
  pull_request:
    paths: [".github/workflows/pre-autosave-v0.3.16.yml", "ci/pre_autosave_v0.3.16/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-autosave-v0.3.16-${{ github.ref }}
  cancel-in-progress: true

env:
  KIT_ZIP: ci/pre_autosave_v0.3.16/Provoware_Naqya_CROSS_PLATFORM_ACCEPTANCE_KIT_FERTIG_v0.3.16.zip
  KIT_SHA256: fed1574a7bff6318633cc5b50d25b0aaea02ba1dc6ebed9c555f84fd5340edb3
  KIT_FOLDER: Provoware_Naqya_CROSS_PLATFORM_ACCEPTANCE_KIT_v0.3.16
  PLAN_ID: NAQYA-PRE-AUTOSAVE-ACCEPTANCE-v0.3.16-r2
  PLAN_HASH: cfc12de3378151c50ad005ff837e5542382c1c7f067e1041cd4804f95d2d111f

jobs:
  source-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Verify frozen archive and source lock
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          z=pathlib.Path(os.environ["KIT_ZIP"])
          assert hashlib.sha256(z.read_bytes()).hexdigest()==os.environ["KIT_SHA256"]
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"naqya-kit"
          with zipfile.ZipFile(z) as f:f.extractall(out)
          root=out/os.environ["KIT_FOLDER"]
          lock=json.loads((root/"QUELLSTAND_LOCK_FERTIG_v0.3.16.json").read_text())
          assert lock["planId"]==os.environ["PLAN_ID"]
          assert lock["planHash"]==os.environ["PLAN_HASH"]
          for rel,want in lock.items():
              if rel in {"planId","planHash"}:continue
              p=root/rel
              assert p.is_file(),rel
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert got==want,f"{rel}: {got} != {want}"
          print("Archive + five locked sources + plan: PASS")
          PY
          ROOT="${RUNNER_TEMP}/naqya-kit/${KIT_FOLDER}"
          python -m py_compile "$ROOT/ENTWICKLUNG_LOKAL_NICHT_INS_REPO/werkzeuge/cross_platform_runner_FERTIG_v0.3.16.py"
          node --check "$ROOT/BASIS_RELEASE/basis/skripte/transaktion_FERTIG_v0.3.16.js"
          node --check "$ROOT/ENTWICKLUNG_LOKAL_NICHT_INS_REPO/tests/transaction_kill_worker_FERTIG_v0.3.16.mjs"

  hosts:
    needs: source-lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: Linux, runner: ubuntu-latest, os: linux}
          - {label: Windows, runner: windows-latest, os: windows}
          - {label: macOS, runner: macos-latest, os: macos}
    name: Native host ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Extract exact kit
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,os,pathlib,zipfile
          z=pathlib.Path(os.environ["KIT_ZIP"])
          assert hashlib.sha256(z.read_bytes()).hexdigest()==os.environ["KIT_SHA256"]
          with zipfile.ZipFile(z) as f:f.extractall(pathlib.Path(os.environ["RUNNER_TEMP"])/"naqya-kit")
          PY
      - name: Kill / recovery / 5,000 memo gate
        shell: bash
        env: {EVIDENCE_OS: "${{ matrix.os }}"}
        run: |
          ROOT="${RUNNER_TEMP}/naqya-kit/${KIT_FOLDER}"
          R="$ROOT/ENTWICKLUNG_LOKAL_NICHT_INS_REPO/werkzeuge/cross_platform_runner_FERTIG_v0.3.16.py"
          set +e; python "$R"; rc=$?; set -e
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || exit "$rc"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"naqya-kit"/os.environ["KIT_FOLDER"]
          files=sorted((root/"ENTWICKLUNG_LOKAL_NICHT_INS_REPO/evidence").glob(f"platform_{os.environ['EVIDENCE_OS']}_*_v0.3.16.json"),key=lambda p:p.stat().st_mtime)
          assert files
          d=json.loads(files[-1].read_text())
          c={x["id"]:x for x in d["checks"]}
          assert d["host"]["os"]==os.environ["EVIDENCE_OS"]
          assert d["hostAcceptance"]=="PASS"
          assert c["process-kill-recovery"]["status"]=="PASS"
          assert c["stress-5000"]["status"]=="PASS"
          print(os.environ["EVIDENCE_OS"],"host acceptance: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: naqya-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/naqya-kit/Provoware_Naqya_CROSS_PLATFORM_ACCEPTANCE_KIT_v0.3.16/ENTWICKLUNG_LOKAL_NICHT_INS_REPO/evidence/platform_${{ matrix.os }}_*_v0.3.16.json
          if-no-files-found: error

  firefox:
    needs: source-lock
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - uses: browser-actions/setup-firefox@v1
        with: {firefox-version: latest}
      - name: Extract exact kit and run real Firefox
        shell: bash
        run: |
          firefox --version
          python - <<'PY'
          import hashlib,os,pathlib,zipfile
          z=pathlib.Path(os.environ["KIT_ZIP"])
          assert hashlib.sha256(z.read_bytes()).hexdigest()==os.environ["KIT_SHA256"]
          with zipfile.ZipFile(z) as f:f.extractall(pathlib.Path(os.environ["RUNNER_TEMP"])/"naqya-kit")
          PY
          ROOT="${RUNNER_TEMP}/naqya-kit/${KIT_FOLDER}"
          R="$ROOT/ENTWICKLUNG_LOKAL_NICHT_INS_REPO/werkzeuge/cross_platform_runner_FERTIG_v0.3.16.py"
          set +e; python "$R"; rc=$?; set -e
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || exit "$rc"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"naqya-kit"/os.environ["KIT_FOLDER"]
          files=sorted((root/"ENTWICKLUNG_LOKAL_NICHT_INS_REPO/evidence").glob("platform_linux_*_v0.3.16.json"),key=lambda p:p.stat().st_mtime)
          assert files
          d=json.loads(files[-1].read_text())
          ff=next(x for x in d["checks"] if x["id"]=="firefox-e2e")
          assert d["hostAcceptance"]=="PASS"
          assert ff["status"]=="PASS",ff
          z=ff["details"]
          assert z["ok"] and z["probe"]["firefox"]
          assert z["stress5000"]["count"]==5000
          assert all(x["ok"] for x in z["killRecovery"])
          print("Real Firefox kill/recovery/5,000: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: naqya-evidence-firefox
          path: ${{ runner.temp }}/naqya-kit/Provoware_Naqya_CROSS_PLATFORM_ACCEPTANCE_KIT_v0.3.16/ENTWICKLUNG_LOKAL_NICHT_INS_REPO/evidence/platform_linux_*_v0.3.16.json
          if-no-files-found: error

  merge:
    needs: [hosts, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Extract exact kit
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,os,pathlib,zipfile
          z=pathlib.Path(os.environ["KIT_ZIP"])
          assert hashlib.sha256(z.read_bytes()).hexdigest()==os.environ["KIT_SHA256"]
          with zipfile.ZipFile(z) as f:f.extractall(pathlib.Path(os.environ["RUNNER_TEMP"])/"naqya-kit")
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: naqya-evidence-*
          path: ${{ runner.temp }}/naqya-kit/Provoware_Naqya_CROSS_PLATFORM_ACCEPTANCE_KIT_v0.3.16/ENTWICKLUNG_LOKAL_NICHT_INS_REPO/evidence
          merge-multiple: true
      - name: Merge exact-source evidence and decide GO / NO-GO
        shell: bash
        run: |
          ROOT="${RUNNER_TEMP}/naqya-kit/${KIT_FOLDER}"
          R="$ROOT/ENTWICKLUNG_LOKAL_NICHT_INS_REPO/werkzeuge/cross_platform_runner_FERTIG_v0.3.16.py"
          python "$R" --merge-only
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"naqya-kit"/os.environ["KIT_FOLDER"]
          mf=root/"ENTWICKLUNG_LOKAL_NICHT_INS_REPO/manifeste/manifest_evidence_BEWIESEN_v0.3.16.json"
          assert mf.is_file()
          d=json.loads(mf.read_text())
          assert d["status"]=="PASS" and d["v0_4_0_safe_autosave_freigabe"] is True
          assert d["planId"]==os.environ["PLAN_ID"] and d["planHash"]==os.environ["PLAN_HASH"]
          assert all(x["status"]=="PASS" for x in d["checks"])
          prov={"schemaVersion":1,"version":"0.3.16","githubRepository":os.environ["GITHUB_REPOSITORY"],"githubCommit":os.environ["GITHUB_SHA"],"githubRunId":os.environ["GITHUB_RUN_ID"],"githubRunAttempt":os.environ["GITHUB_RUN_ATTEMPT"],"manifestSha256":hashlib.sha256(mf.read_bytes()).hexdigest(),"planId":d["planId"],"planHash":d["planHash"],"decision":"GO"}
          (root/"ENTWICKLUNG_LOKAL_NICHT_INS_REPO/berichte/CI_PROVENANCE_BEWIESEN_v0.3.16.json").write_text(json.dumps(prov,indent=2))
          print("V0.4.0 SAFE AUTOSAVE PRE-AUTOSAVE gate: GO")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PRE_AUTOSAVE_EVIDENCE_BEWIESEN_v0.3.16
          path: |
            ${{ runner.temp }}/naqya-kit/Provoware_Naqya_CROSS_PLATFORM_ACCEPTANCE_KIT_v0.3.16/ENTWICKLUNG_LOKAL_NICHT_INS_REPO/evidence/*.json
            ${{ runner.temp }}/naqya-kit/Provoware_Naqya_CROSS_PLATFORM_ACCEPTANCE_KIT_v0.3.16/ENTWICKLUNG_LOKAL_NICHT_INS_REPO/manifeste/manifest_evidence_BEWIESEN_v0.3.16.json
            ${{ runner.temp }}/naqya-kit/Provoware_Naqya_CROSS_PLATFORM_ACCEPTANCE_KIT_v0.3.16/ENTWICKLUNG_LOKAL_NICHT_INS_REPO/berichte/cross_platform_runner_BEWIESEN_v0.3.16.md
            ${{ runner.temp }}/naqya-kit/Provoware_Naqya_CROSS_PLATFORM_ACCEPTANCE_KIT_v0.3.16/ENTWICKLUNG_LOKAL_NICHT_INS_REPO/berichte/CI_PROVENANCE_BEWIESEN_v0.3.16.json
          if-no-files-found: error
          retention-days: 90
