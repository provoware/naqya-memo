name: profile-blanco-truthfulness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: profile-blanco-truthfulness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  truthfulness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Profile Blanco truthfulness gate
        run: |
          python -S tests/release_gate/test_profile_blanco_truthfulness.py

      - name: Auth profile dependency containment
        run: |
          python -S tests/security/test_auth_profile_dependency_containment.py

      - name: Desktop auth boundary regressions
        env:
          PYTHONPATH: core/reference_python
        run: |
          set -euo pipefail
          tests=(
            tests/security/test_desktop_pin_gate.py
            tests/security/test_first_pin_file_symlink_guard.py
            tests/security/test_desktop_auth_cache_revision.py
            tests/security/test_desktop_auth_cache_profile_incarnation.py
            tests/security/test_desktop_auth_cache_credential_fingerprint.py
            tests/security/test_desktop_auth_cache_uncertainty_eviction.py
            tests/security/test_desktop_auth_read_connection.py
          )
          for test in "${tests[@]}"; do
            echo "RUN $test"
            python -S "$test"
          done
