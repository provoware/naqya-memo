name: NAQYA Plattform-Bundle-Nachweis

on:
  pull_request:
    paths:
      - '.github/workflows/bundle-platforms.yml'
      - '.github/workflows/bundle-linux.yml'
      - '.github/workflows/bundle-windows.yml'
      - 'VERSION.json'
      - 'PROJEKTSTATUS.json'
      - 'index.html'
      - 'styles.css'
      - 'styles-02.css'
      - 'app.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'diagnostics/**'
      - 'services/**'
      - 'src-tauri/**'
      - 'tools/build_whisper_sidecar.sh'
      - 'tools/build_whisper_sidecar_windows.ps1'
      - 'tools/stage_desktop_frontend.py'
      - 'tools/repack_deb_deterministic.sh'
      - 'tools/generate_release_evidence.py'
      - 'tests/validate_dist.py'
      - 'tests/validate_diagnostics.py'
      - 'tests/validate_platform_diagnostics.py'
      - 'tests/diagnostics_runtime.test.js'
      - 'tests/validate_release_evidence.py'
      - 'tests/compare_release_evidence.py'
      - 'release/RELEASE_EVIDENCE.schema.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bundle-platforms.yml'
      - '.github/workflows/bundle-linux.yml'
      - '.github/workflows/bundle-windows.yml'
      - 'VERSION.json'
      - 'PROJEKTSTATUS.json'
      - 'index.html'
      - 'styles.css'
      - 'styles-02.css'
      - 'app.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'diagnostics/**'
      - 'services/**'
      - 'src-tauri/**'
      - 'tools/build_whisper_sidecar.sh'
      - 'tools/build_whisper_sidecar_windows.ps1'
      - 'tools/stage_desktop_frontend.py'
      - 'tools/repack_deb_deterministic.sh'
      - 'tools/generate_release_evidence.py'
      - 'tests/validate_dist.py'
      - 'tests/validate_diagnostics.py'
      - 'tests/validate_platform_diagnostics.py'
      - 'tests/diagnostics_runtime.test.js'
      - 'tests/validate_release_evidence.py'
      - 'tests/compare_release_evidence.py'
      - 'release/RELEASE_EVIDENCE.schema.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: '946684800'

jobs:
  linux:
    uses: ./.github/workflows/bundle-linux.yml

  windows:
    uses: ./.github/workflows/bundle-windows.yml

  evidence-vergleich:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Nachweis herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: naqya-linux-bundle-nachweis-*
          path: evidence/linux
          merge-multiple: true

      - name: Windows-Nachweis herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: naqya-windows-bundle-nachweis-*
          path: evidence/windows
          merge-multiple: true

      - name: Plattformvertrag erneut sperren
        run: python3 tests/validate_platform_diagnostics.py

      - name: Einzel-Evidence erneut validieren
        run: |
          python3 tests/validate_release_evidence.py evidence/linux/RELEASE_EVIDENCE.json
          python3 tests/validate_release_evidence.py evidence/windows/RELEASE_EVIDENCE.windows.json

      - name: Linux und Windows byte- und semantikgebunden vergleichen
        run: |
          python3 tests/compare_release_evidence.py \
            evidence/linux/RELEASE_EVIDENCE.json \
            evidence/windows/RELEASE_EVIDENCE.windows.json \
            | tee evidence/PLATTFORM_EVIDENCE_VERGLEICH.txt

      - name: Plattformvergleich sichern
        uses: actions/upload-artifact@v4
        with:
          name: naqya-plattform-evidence-vergleich-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: evidence/PLATTFORM_EVIDENCE_VERGLEICH.txt
