name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python syntax
        run: |
          python -m py_compile app/server.py app/secure_server.py app/secure_response_server.py tools/startup_port_guard.py tools/release_gate/evaluate_release_gate.py tools/release_gate/require_clean_worktree.py

      - name: JavaScript syntax
        run: |
          node --check ui/reference_web/app.js
          if [ -f ui/reference_web/mobile/mobile_core.js ]; then node --check ui/reference_web/mobile/mobile_core.js; fi
          if [ -f ui/reference_web/mobile/mobile_bootstrap.js ]; then node --check ui/reference_web/mobile/mobile_bootstrap.js; fi
          if [ -f ui/reference_web/mobile/mobile_acceptance.js ]; then node --check ui/reference_web/mobile/mobile_acceptance.js; fi

      - name: UI contracts
        run: |
          for test in \
            tests/ui_consistency/test_v01222_static_ui_consistency.py \
            tests/ui_consistency/test_v01223_simplification_guidance.py \
            tests/ui_consistency/test_v01224_ux_control_plane.py \
            tests/ui_consistency/test_v01225_real_viewport_ux.py
          do
            if [ -f "$test" ]; then
              echo "RUN $test"
              python -S "$test"
            else
              echo "SKIP $test (not present in this version)"
            fi
          done

      - name: Startup contracts
        run: |
          if [ -f tests/startup/test_startup_port_guard.py ]; then
            PYTHONPATH=core/reference_python python -S tests/startup/test_startup_port_guard.py
          fi

      - name: Release gate evidence freshness
        run: |
          python -S tests/release_gate/test_release_gate_evidence_freshness.py

      - name: Release gate clean worktree
        run: |
          python -S tests/release_gate/test_release_gate_clean_worktree.py

      - name: Existing project DB preflight fail-closed
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_existing_db_preflight_fail_closed.py

      - name: Desktop PIN gate
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_desktop_pin_gate.py

      - name: Desktop first-PIN file symlink guard
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_first_pin_file_symlink_guard.py

      - name: Desktop auth cache revision invalidation
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_desktop_auth_cache_revision.py

      - name: Desktop auth cache profile incarnation invalidation
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_desktop_auth_cache_profile_incarnation.py

      - name: Desktop auth cache credential fingerprint invalidation
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_desktop_auth_cache_credential_fingerprint.py

      - name: Desktop auth cache uncertainty eviction
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_desktop_auth_cache_uncertainty_eviction.py

      - name: Desktop auth security read isolation
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_desktop_auth_read_connection.py

      - name: Desktop transport trust boundary
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_desktop_transport_trust.py

      - name: Desktop response security headers
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_desktop_response_headers.py

      - name: Desktop JSON request body limit
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_desktop_json_body_limit.py

      - name: Desktop request I/O timeout
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_desktop_request_io_timeout.py

      - name: Desktop security config parsing
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_desktop_security_config_parse.py

      - name: Desktop auth security config parsing
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_desktop_auth_config_parse.py

      - name: Desktop upload limit config parsing
        run: |
          PYTHONPATH=core/reference_python python -S tests/security/test_desktop_upload_config_parse.py

      - name: Mobile source contracts
        run: |
          if [ -f tests/mobile/test_mobile_sources.py ]; then
            PYTHONPATH=core/reference_python python -S tests/mobile/test_mobile_sources.py
          fi
          if [ -f tests/mobile/test_cross_runtime_parity.py ]; then
            PYTHONPATH=core/reference_python python -S tests/mobile/test_cross_runtime_parity.py
          fi
          if [ -f tests/mobile/test_mobile_core.mjs ]; then
            node tests/mobile/test_mobile_core.mjs
          fi

      - name: Evidence boundary
        run: |
          echo "CI validates source contracts plus release-gate evidence freshness/clean-worktree, fail-closed existing-DB preflight, local desktop PIN/bootstrap-file hardening, auth-cache revision/incarnation/credential-fingerprint/uncertainty invalidation, isolated auth-security reads, transport-trust, response-security, bounded JSON-body, bounded request-I/O and fail-safe security-config runtime gates only."
          echo "CI does NOT turn real browser, microphone, Android-device or iPhone-device release gates green."
