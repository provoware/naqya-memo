name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python syntax
        run: |
          python -m py_compile app/server.py tools/startup_port_guard.py

      - name: JavaScript syntax
        run: |
          node --check ui/reference_web/app.js
          node --check ui/reference_web/mobile/mobile_core.js
          node --check ui/reference_web/mobile/mobile_bootstrap.js
          node --check ui/reference_web/mobile/mobile_acceptance.js

      - name: UI contracts
        run: |
          python -S tests/ui_consistency/test_v01222_static_ui_consistency.py
          python -S tests/ui_consistency/test_v01223_simplification_guidance.py
          python -S tests/ui_consistency/test_v01224_ux_control_plane.py

      - name: Startup contracts
        run: |
          PYTHONPATH=core/reference_python python -S tests/startup/test_startup_port_guard.py

      - name: Mobile source contracts
        run: |
          PYTHONPATH=core/reference_python python -S tests/mobile/test_mobile_sources.py
          PYTHONPATH=core/reference_python python -S tests/mobile/test_cross_runtime_parity.py
          node tests/mobile/test_mobile_core.mjs

      - name: Evidence note
        run: |
          echo "CI validates source contracts only."
          echo "It does NOT turn real device/browser/microphone release gates green."
