name: NAQYA Qualitätsprüfung
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON prüfen
        run: |
          python3 -m json.tool VERSION.json >/dev/null
          python3 -m json.tool PROJEKTSTATUS.json >/dev/null
          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 -m json.tool src-tauri/tauri.conf.json >/dev/null
          python3 -m json.tool src-tauri/sidecar/whisper-runtime.json >/dev/null
      - name: JavaScript-Syntax prüfen
        run: |
          node --check app.js
          node --check sw.js
          node --check services/capabilities.js
          node --check services/native-bridge.js
          node --check services/stt-core.js
          node --check services/audio-normalizer.js
          node --check services/live-stt.js
          node --check services/release-04.js
      - name: Tauri Linux-Prüfabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev cmake build-essential
      - name: Reproduzierbaren Linux-Sidecar bauen
        run: tools/build_whisper_sidecar.sh
      - name: Sidecar-Artefakt prüfen
        run: |
          test -x src-tauri/binaries/naqya-whisper-x86_64-unknown-linux-gnu
          sha256sum -c src-tauri/binaries/naqya-whisper-x86_64-unknown-linux-gnu.sha256
      - name: Rust formatieren
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust kompilieren prüfen
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Statische Verträge prüfen
        run: |
          python3 tests/validate_static.py
          python3 tests/validate_sidecar.py
      - name: Shell-Syntax prüfen
        run: |
          bash -n START_NAQYA.sh
          bash -n tools/build_whisper_sidecar.sh
