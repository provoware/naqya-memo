name: NAQYA Qualitätsprüfung
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON-Struktur prüfen
        run: |
          python3 -m json.tool VERSION.json >/dev/null
          python3 -m json.tool PROJEKTSTATUS.json >/dev/null
          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 -m json.tool src-tauri/tauri.conf.json >/dev/null
          python3 -m json.tool src-tauri/sidecar/whisper-runtime.json >/dev/null
          python3 -m json.tool diagnostics/DIAGNOSTICS_CONTRACT.json >/dev/null
          python3 -m json.tool release/RELEASE_EVIDENCE.schema.json >/dev/null
          python3 -m json.tool hardware/HARDWARE_ACCEPTANCE.schema.json >/dev/null
      - name: Text- und Merge-Integrität prüfen
        run: python3 tests/validate_text_integrity.py
      - name: JavaScript-Syntax prüfen
        run: |
          node --check app.js
          node --check sw.js
          node --check services/capabilities.js
          node --check services/diagnostics.js
          node --check services/native-bridge.js
          node --check services/stt-core.js
          node --check services/audio-normalizer.js
          node --check services/live-stt.js
          node --check services/release-04.js
      - name: Diagnose-Laufzeitregression prüfen
        run: |
          node tests/diagnostics_runtime.test.js
          python3 tests/validate_diagnostics.py
          python3 tests/validate_platform_diagnostics.py
      - name: Windows-, Plattform-, Fingerprint- und Hardwarevertrag statisch prüfen
        run: |
          python3 -m py_compile tools/generate_release_evidence.py tests/validate_release_evidence.py tests/compare_release_evidence.py tests/validate_platform_diagnostics.py tests/validate_windows_release_contract.py tests/validate_evidence_fingerprint.py tests/validate_hardware_acceptance.py
          python3 tests/validate_windows_release_contract.py
          python3 tests/validate_evidence_fingerprint.py
          python3 tests/validate_hardware_acceptance.py --schema-only
      - name: Desktop-Frontend stagen und prüfen
        run: |
          python3 tools/stage_desktop_frontend.py
          python3 tests/validate_dist.py
          python3 tests/validate_release_evidence.py --schema-only
      - name: Tauri Linux-Prüfabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev cmake build-essential dpkg-dev
      - name: Deterministische DEB-Reproduzierbarkeit prüfen
        run: python3 tests/validate_deb_reproducibility.py
      - name: Reproduzierbaren Linux-Sidecar bauen
        run: bash tools/build_whisper_sidecar.sh
      - name: Sidecar-Artefakt prüfen
        run: |
          test -x src-tauri/binaries/naqya-whisper-x86_64-unknown-linux-gnu
          (cd src-tauri/binaries && sha256sum -c naqya-whisper-x86_64-unknown-linux-gnu.sha256)
      - name: Rust formatieren
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust kompilieren prüfen
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Statische Verträge prüfen
        run: |
          python3 tests/validate_static.py
          python3 tests/validate_sidecar.py
      - name: Shell-Syntax prüfen
        run: |
          bash -n START_NAQYA.sh
          bash -n tools/build_whisper_sidecar.sh
          bash -n tools/repack_deb_deterministic.sh
