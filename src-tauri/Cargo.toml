[package]
name = "naqya-desktop"
version = "0.3.0"
description = "PROVOWARE – NAQYA Memo Tool 2026 native Desktop-Brücke"
authors = ["PROVOWARE"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "naqya_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.16.0"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
