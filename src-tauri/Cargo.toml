[package]
name = "naqya-memo"
version = "0.5.0"
description = "PROVOWARE – NAQYA Memo Tool 2026"
authors = ["PROVOWARE"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
num_cpus = "1"
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
